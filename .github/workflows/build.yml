name: CI

on: [push, pull_request]

jobs:
  build_yarg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Files
        run: |
          dependencies/python/configure_yarg_build.py
          dependencies/linux/ninja

      # --- Build arson-fmt (Rust) ---
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Checkout arson repo
        uses: actions/checkout@v4
        with:
          repository: hmxmilohax/arson
          path: arson

      - name: Cargo build arson-fmt
        working-directory: arson
        run: cargo build

      - name: Format songs_updates.dta with arson-fmt
        run: |
          ./arson/target/debug/arson-fmt "$GITHUB_WORKSPACE/out/yarg/songs_updates/songs_updates.dta"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: RB3DX-YARG-Updates
          path: out/yarg


  build_xbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build ARK
        run: |
          dependencies/python/configure_build.py xbox
          dependencies/linux/ninja
      - name: Remove .gitkeep
        run: |
          find . -name ".gitkeep" -type f -delete
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: RB3DX-Xbox
          path: out/xbox

  build_xbox_char:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Merge assets into _ark
        run: |
          cp -r rb3dx_assets/char/. _ark/char/
          cp -r rb3dx_assets/dx/. _ark/dx/
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build ARK
        run: |
          dependencies/python/configure_build.py xbox --define CUSTOMCHARS
          dependencies/linux/ninja
      - name: Remove .gitkeep
        run: |
          find . -name ".gitkeep" -type f -delete
      - name: Create character warning
        run: |
          echo "Custom characters are still experimental, you may encounter bugs such as face deformation. This can be solved by making sure the stock RB character you are switching from matches the gender of the custom character. You can also set the characters on your profile on first boot." > "Please read before installing.txt"
          echo "If you decide to update to a build without custom characters, please make sure to remove any characters as stand-ins prior to updating or you game may crash" >> "Please read before installing.txt"
          cp "Please read before installing.txt" out/xbox/
      - name: Create character warning Spanish
        run: |
          echo "Los personajes custom todavía son experimentales, así que puedes tener deformaciones con caras. Puedes arreglar esto cambiando a un personaje "vanilla" de Rock Band con el mismo sexo del personaje custom. También puedes asignar personajes custom a tu banda como sustitutos para evitar este problema." > "Lee antes de instalar.txt"
          echo "Si necesitas actualizar o cambiar a una versión sin personajes custom, por favor quita cualquier personaje custom de sustituto." >> "Lee antes de instalar.txt"
          cp "Lee antes de instalar.txt" out/xbox/
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: RB3DX-Xbox-CustomCharacters
          path: out/xbox

  build_xbox_no_updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build ARK
        run: |
          dependencies/python/configure_build.py xbox --no-updates
          dependencies/linux/ninja
      - name: Remove .gitkeep
        run: |
          find . -name ".gitkeep" -type f -delete
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: RB3DX-Xbox-No-Updates
          path: out/xbox

  build_ps3:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build ARK
        run: |
          python dependencies/python/configure_build.py ps3
          dependencies/windows/ninja.exe
      - name: Build PKG
        run: |
          $sha_short="$(git rev-parse --short HEAD)".ToUpper()
          $content="RB3DXNITE"
          dependencies/windows/RB3DXBuildPkgPS3.exe out/ps3 usa ($content + $sha_short) .
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: RB3DX-PS3
          path: '*.pkg'

  build_ps3_char:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Merge assets into _ark
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "_ark/char"
          New-Item -ItemType Directory -Force -Path "_ark/dx"
          Copy-Item -Path "rb3dx_assets/char/*" -Destination "_ark/char" -Recurse -Force
          Copy-Item -Path "rb3dx_assets/dx/*" -Destination "_ark/dx" -Recurse -Force
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build ARK
        run: |
          python dependencies/python/configure_build.py ps3 --define CUSTOMCHARS
          dependencies/windows/ninja.exe
      - name: Build PKG
        run: |
          $sha_short="$(git rev-parse --short HEAD)".ToUpper()
          $content="RB3DXNITE"
          dependencies/windows/RB3DXBuildPkgPS3.exe out/ps3 usa ($content + $sha_short) .
      - name: Create character warning
        shell: bash
        run: |
          mkdir -p artifact
          cp *.pkg artifact/
          echo "Custom characters are still experimental, you may encounter bugs such as face deformation. This can be solved by making sure the stock RB character you are switching from matches the gender of the custom character. You can also set the characters on your profile on first boot." > artifact/"Please read before installing.txt"
          echo "If you decide to update to a build without custom characters, please make sure to remove any characters as stand-ins prior to updating or you game may crash" >> artifact/"Please read before installing.txt"
      - name: Create character warning Spanish
        shell: bash
        run: |
          mkdir -p artifact
          echo "Los personajes custom todavía son experimentales, así que puedes tener deformaciones con caras. Puedes arreglar esto cambiando a un personaje "vanilla" de Rock Band con el mismo sexo del personaje custom. También puedes asignar personajes custom a tu banda como sustitutos para evitar este problema." > artifact/"Lee antes de instalar.txt"
          echo "Si necesitas actualizar o cambiar a una versión sin personajes custom, por favor quita cualquier personaje custom de sustituto." >> artifact/"Lee antes de instalar.txt"
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: RB3DX-PS3-CustomCharacters
          path: |
            artifact

  build_xbox_ptbr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Translate locale
        run: |
          python dependencies/python/ptbr.py
        working-directory: ${{ github.workspace }}
      - name: Build ARK
        run: |
          dependencies/python/configure_build.py xbox
          dependencies/linux/ninja
      - name: Remove .gitkeep
        run: |
          find . -name ".gitkeep" -type f -delete
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: RB3DX-Xbox-BRAZIL
          path: out/xbox

  build_ps3_ptbr:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Translate locale
        run: |
          python dependencies/python/ptbr.py
        working-directory: ${{ github.workspace }}
      - name: Build ARK
        run: |
          python dependencies/python/configure_build.py ps3
          dependencies/windows/ninja.exe
      - name: Build PKG
        run: |
          $sha_short="$(git rev-parse --short HEAD)".ToUpper()
          $content="RB3DXNITE"
          dependencies/windows/RB3DXBuildPkgPS3.exe out/ps3 usa ($content + $sha_short) .
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: RB3DX-PS3-BRAZIL
          path: '*.pkg'

  build_wii:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set env
        run: |
          mkdir ./build
          mkdir platform/wii/files
          mkdir platform/wii/files/gen
          cp dependencies/wii_patcher/main_wii.hdr platform/wii/files/gen/main_wii.hdr
          mkdir platform/wii/sys
          truncate -s 13068128 platform/wii/sys/main.dol
          truncate -s 22353239 platform/wii/files/gen/main_wii_0.ark
          truncate -s 5721833 platform/wii/files/gen/main_wii_1.ark
          truncate -s 24584681 platform/wii/files/gen/main_wii_2.ark
          truncate -s 266057007 platform/wii/files/gen/main_wii_3.ark
          truncate -s 688887924 platform/wii/files/gen/main_wii_4.ark
          truncate -s 107950925 platform/wii/files/gen/main_wii_5.ark
          truncate -s 468328063 platform/wii/files/gen/main_wii_6.ark
          truncate -s 22352016 platform/wii/files/gen/main_wii_7.ark
          truncate -s 1983799220 platform/wii/files/gen/main_wii_8.ark
          truncate -s 300667016 platform/wii/files/gen/main_wii_9.ark
      - name: Build ARK
        run: |
          dependencies/python/configure_build.py wii
          dependencies/linux/ninja
      - uses: edgarrc/action-7z@v1
        with:
          args: 7z a -t7z -mx=9 build.7z ./build/
      - name: Configure Tools
        run: |
          7z x dependencies/wii_patcher/wiimmfi-patcher-v7.5.zip
          mv wiimmfi-patcher-v7.5 rb3dx_wii_patcher
          mkdir rb3dx_wii_patcher/wii_patch_files
          mkdir rb3dx_wii_patcher/wii_patch_files/gen
          cp out/wii/files/gen/main_wii.hdr rb3dx_wii_patcher/wii_patch_files/gen/main_wii.hdr
          cp out/wii/files/gen/main_wii_10.ark rb3dx_wii_patcher/wii_patch_files/gen/main_wii_10.ark
          cp dependencies/wii_patcher/patch-images.sh rb3dx_wii_patcher/patch-images.sh
          cp dependencies/wii_patcher/setup.sh rb3dx_wii_patcher/bin/setup.sh
      - name: Remove .gitkeep
        run: |
          find . -name ".gitkeep" -type f -delete
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: RB3DX-Wii-Patcher
          path: rb3dx_wii_patcher